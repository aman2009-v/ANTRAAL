<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesture 3D Particle Playground</title>
    <style>
        :root {
            --bg-color: #050505;
            --panel-bg: rgba(20, 20, 30, 0.6);
            --accent: #00f0ff;
            --text: #ffffff;
            --font: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--font);
            color: var(--text);
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Video hidden, used for processing */
        #input-video {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            pointer-events: none;
            width: 1px; 
            height: 1px;
            z-index: -1;
        }

        /* UI Layer */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none; /* Let clicks pass through to canvas where UI isn't */
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            transition: transform 0.2s ease;
        }
        
        .panel:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 10px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff4444;
            transition: background 0.3s;
        }
        .status-dot.active {
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        /* Controls */
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        /* Shape Grid */
        .shape-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .shape-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .shape-btn:hover, .shape-btn.active {
            background: var(--accent);
            color: #000;
            transform: scale(1.05);
        }

        /* Sliders */
        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            height: 4px;
            border-radius: 2px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--text);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Color Picker */
        .color-picker-wrapper {
            display: flex;
            gap: 10px;
        }
        input[type=color] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type=color]::-webkit-color-swatch { border: none; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }

        /* Toggles */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.2);
            transition: .4s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Snapshot Button */
        .action-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .action-btn:hover { background: rgba(255,255,255,0.2); }

        /* Loading */
        #loader {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Gesture Tips */
        .gesture-tip {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 10px;
            line-height: 1.4;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="loading-text">Loading Models...</div>
    </div>

    <div id="ui-container">
        <div class="panel">
            <h1>Particle Lab <span id="cam-status" class="status-dot" title="Camera Status"></span></h1>
            
            <div class="toggle-row">
                <label>Gesture Control</label>
                <label class="switch">
                    <input type="checkbox" id="toggle-camera" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="control-group">
                <label>Shape Template</label>
                <div class="shape-grid" id="shape-selector">
                    <button class="shape-btn active" data-shape="sphere" title="Sphere">●</button>
                    <button class="shape-btn" data-shape="heart" title="Heart">♥</button>
                    <button class="shape-btn" data-shape="flower" title="Flower">✿</button>
                    <button class="shape-btn" data-shape="saturn" title="Saturn">🪐</button>
                    <button class="shape-btn" data-shape="buddha" title="Buddha">🧘</button>
                </div>
            </div>

            <div class="control-group">
                <label>Particle Color</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="color-input" value="#00f0ff">
                    <div style="flex-grow:1; display:flex; align-items:center; font-size:0.8rem; opacity:0.7;">
                        Pick a base hue
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Particle Size</label>
                <input type="range" id="size-slider" min="1" max="10" step="0.1" value="3">
            </div>

            <div class="control-group">
                <label>Chaos / Noise</label>
                <input type="range" id="noise-slider" min="0" max="2" step="0.01" value="0.5">
            </div>

            <button class="action-btn" id="snap-btn">📷 Take Snapshot</button>

            <div class="gesture-tip">
                <b>Gestures:</b><br>
                ✊ Close fist: Contract/Implode<br>
                🖐 Open hand: Explode/Scatter<br>
                ↔️ Hands apart: Scale up
            </div>
        </div>
    </div>

    <video id="input-video" playsinline></video>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/hands": "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js",
                "@mediapipe/camera_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration & State ---
        const CONFIG = {
            particleCount: 15000,
            baseColor: new THREE.Color('#00f0ff'),
            cameraEnabled: true,
            sensitivity: 2.0
        };

        const STATE = {
            gestureScale: 1.0,    // Global scale (distance between hands)
            gestureSpread: 0.0,   // Chaos/Expansion (Fist vs Open)
            targetShape: 'sphere',
            manualMode: false,
            mouse: new THREE.Vector2()
        };

        // --- Geometry Generators ---
        
        // Helper: Random point in sphere
        function randomSpherePoint(r) {
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            return new THREE.Vector3(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.sin(phi) * Math.sin(theta),
                r * Math.cos(phi)
            );
        }

        const Generators = {
            sphere: (cnt) => {
                const arr = [];
                for(let i=0; i<cnt; i++) {
                    const p = randomSpherePoint(10);
                    arr.push(p.x, p.y, p.z);
                }
                return new Float32Array(arr);
            },
            heart: (cnt) => {
                const arr = [];
                for(let i=0; i<cnt; i++) {
                    // Heart parametric equation
                    // x = 16sin^3(t)
                    // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
                    // z = random thickness
                    const t = Math.random() * Math.PI * 2;
                    const scale = 0.5;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    const z = (Math.random() - 0.5) * 10; 
                    
                    // Add volume
                    const v = randomSpherePoint(1);
                    arr.push((x + v.x) * scale, (y + v.y) * scale, (z + v.z) * scale);
                }
                return new Float32Array(arr);
            },
            flower: (cnt) => {
                const arr = [];
                for(let i=0; i<cnt; i++) {
                    // Rose/Flower curve
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    const k = 4; // petals
                    const r = 8 * Math.cos(k * theta) + 2;
                    
                    const x = r * Math.sin(phi) * Math.cos(theta);
                    const y = r * Math.sin(phi) * Math.sin(theta);
                    const z = r * Math.cos(phi) * 0.5; // flatten z
                    arr.push(x, y, z);
                }
                return new Float32Array(arr);
            },
            saturn: (cnt) => {
                const arr = [];
                const ringCount = Math.floor(cnt * 0.7);
                const planetCount = cnt - ringCount;
                
                // Planet
                for(let i=0; i<planetCount; i++) {
                    const p = randomSpherePoint(5);
                    arr.push(p.x, p.y, p.z);
                }
                // Rings
                for(let i=0; i<ringCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 7 + Math.random() * 5; // Ring radius 7 to 12
                    const x = Math.cos(angle) * dist;
                    const z = Math.sin(angle) * dist;
                    const y = (Math.random() - 0.5) * 0.5; // thin ring
                    // Tilt the ring
                    const tilt = 0.4;
                    const yRot = y * Math.cos(tilt) - z * Math.sin(tilt);
                    const zRot = y * Math.sin(tilt) + z * Math.cos(tilt);
                    arr.push(x, yRot, zRot);
                }
                return new Float32Array(arr);
            },
            buddha: (cnt) => {
                // Procedural sitting figure approximation
                const arr = [];
                for(let i=0; i<cnt; i++) {
                    const r = Math.random();
                    let p = new THREE.Vector3();
                    
                    if (r < 0.4) {
                        // Base (Legs crossed) - Ellipsoid
                        const u = Math.random() * Math.PI * 2;
                        const v = Math.random() * Math.PI;
                        p.x = 8 * Math.sin(v) * Math.cos(u);
                        p.z = 5 * Math.sin(v) * Math.sin(u);
                        p.y = 2 * Math.cos(v) - 5;
                    } else if (r < 0.8) {
                        // Torso - Tapered cylinder/sphere
                        const u = Math.random() * Math.PI * 2;
                        const v = Math.random() * Math.PI;
                        p.x = 4.5 * Math.sin(v) * Math.cos(u);
                        p.z = 3.5 * Math.sin(v) * Math.sin(u);
                        p.y = 5 * Math.cos(v); // Center
                    } else {
                        // Head
                        const hp = randomSpherePoint(2.5);
                        p.set(hp.x, hp.y + 5.5, hp.z);
                    }
                    arr.push(p.x, p.y, p.z);
                }
                return new Float32Array(arr);
            }
        };

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        // Subtle fog
        scene.fog = new THREE.FogExp2(CONFIG.baseColor, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- Particle System ---
        
        // Prepare Geometries
        const geometries = {};
        for(const [key, func] of Object.entries(Generators)) {
            geometries[key] = func(CONFIG.particleCount);
        }

        const particleGeometry = new THREE.BufferGeometry();
        // Initialize position with sphere
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(geometries.sphere.slice(), 3));
        
        // Target position attribute (for morphing)
        particleGeometry.setAttribute('targetPosition', new THREE.BufferAttribute(geometries.sphere.slice(), 3));

        // Randomness for noise
        const randoms = new Float32Array(CONFIG.particleCount);
        for(let i=0; i<CONFIG.particleCount; i++) randoms[i] = Math.random();
        particleGeometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

        // Shader Material
        const particleMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: CONFIG.baseColor },
                uSize: { value: 3.0 },
                uMorphFactor: { value: 0.0 }, // 0 to 1 transition
                uSpread: { value: 0.0 },      // Gesture chaos
                uScale: { value: 1.0 }        // Gesture scale
            },
            vertexShader: `
                uniform float uTime;
                uniform float uSize;
                uniform float uMorphFactor;
                uniform float uSpread;
                uniform float uScale;
                
                attribute float aRandom;
                attribute vec3 targetPosition;
                
                varying float vAlpha;

                // Simplex Noise (simplified)
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
                vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
                float snoise(vec3 v) { 
                    const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                    const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                    vec3 i  = floor(v + dot(v, C.yyy) );
                    vec3 x0 = v - i + dot(i, C.xxx) ;
                    vec3 g = step(x0.yzx, x0.xyz);
                    vec3 l = 1.0 - g;
                    vec3 i1 = min( g.xyz, l.zxy );
                    vec3 i2 = max( g.xyz, l.zxy );
                    vec3 x1 = x0 - i1 + C.xxx;
                    vec3 x2 = x0 - i2 + C.yyy;
                    vec3 x3 = x0 - D.yyy;
                    i = mod289(i); 
                    vec4 p = permute( permute( permute( 
                                i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                            + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                            + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                    float n_ = 0.142857142857;
                    vec3  ns = n_ * D.wyz - D.xzx;
                    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                    vec4 x_ = floor(j * ns.z);
                    vec4 y_ = floor(j - 7.0 * x_ );
                    vec4 x = x_ *ns.x + ns.yyyy;
                    vec4 y = y_ *ns.x + ns.yyyy;
                    vec4 h = 1.0 - abs(x) - abs(y);
                    vec4 b0 = vec4( x.xy, y.xy );
                    vec4 b1 = vec4( x.zw, y.zw );
                    vec4 s0 = floor(b0)*2.0 + 1.0;
                    vec4 s1 = floor(b1)*2.0 + 1.0;
                    vec4 sh = -step(h, vec4(0.0));
                    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                    vec3 p0 = vec3(a0.xy,h.x);
                    vec3 p1 = vec3(a0.zw,h.y);
                    vec3 p2 = vec3(a1.xy,h.z);
                    vec3 p3 = vec3(a1.zw,h.w);
                    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                    m = m * m;
                    return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), 
                                                dot(p2,x2), dot(p3,x3) ) );
                }

                void main() {
                    // 1. Morph Logic (Lerp between current position and target)
                    vec3 pos = mix(position, targetPosition, uMorphFactor);

                    // 2. Add Noise/Movement
                    float noiseFreq = 0.5;
                    float noiseAmp = 0.5 + uSpread * 5.0; // Gesture increases chaos
                    
                    vec3 noiseOffset = vec3(
                        snoise(pos * noiseFreq + uTime * 0.5),
                        snoise(pos * noiseFreq + uTime * 0.5 + 100.0),
                        snoise(pos * noiseFreq + uTime * 0.5 + 200.0)
                    );
                    
                    pos += noiseOffset * noiseAmp;

                    // 3. Global Scale (Gesture)
                    pos *= uScale;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    
                    gl_Position = projectionMatrix * mvPosition;
                    
                    // Size attenuation
                    gl_PointSize = uSize * (300.0 / -mvPosition.z);
                    
                    // Fade distant particles
                    vAlpha = 1.0 - smoothstep(50.0, 100.0, length(mvPosition.xyz));
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying float vAlpha;

                void main() {
                    // Circular particle
                    vec2 uv = gl_PointCoord.xy - 0.5;
                    float dist = length(uv);
                    if (dist > 0.5) discard;
                    
                    // Soft edge
                    float alpha = (0.5 - dist) * 2.0 * vAlpha;
                    
                    gl_FragColor = vec4(uColor, alpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // --- Logic & Events ---

        let morphTime = 0;
        let isMorphing = false;
        
        function switchShape(shapeName) {
            if(isMorphing || shapeName === STATE.targetShape) return;
            
            STATE.targetShape = shapeName;
            
            // 1. Snapshot current shader state into 'position' attribute
            // We can't easily read back from shader in WebGL1 without complex FBO
            // So we simply assume the previous 'targetPosition' is now the start
            // and the NEW target is the destination.
            
            const posAttr = particleGeometry.attributes.position;
            const targetAttr = particleGeometry.attributes.targetPosition;
            
            // Current target becomes the starting point
            posAttr.array.set(targetAttr.array);
            posAttr.needsUpdate = true;
            
            // Set new target
            targetAttr.array.set(geometries[shapeName]);
            targetAttr.needsUpdate = true;
            
            // Reset morph uniform
            particleMaterial.uniforms.uMorphFactor.value = 0;
            
            // Trigger animation
            morphTime = 0;
            isMorphing = true;
        }

        // --- MediaPipe / Camera Logic ---

        const videoElement = document.getElementById('input-video');
        const statusDot = document.getElementById('cam-status');
        const loader = document.getElementById('loader');

        // Dynamically load MediaPipe via CDN script tags in global scope
        // Wait for window.Hands to be available
        async function initCamera() {
            if(!window.Hands) {
                setTimeout(initCamera, 100);
                return;
            }

            const hands = new window.Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});
            
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandsResults);

            const cameraUtils = new window.Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            
            try {
                await cameraUtils.start();
                loader.style.opacity = '0'; // Hide loader
                statusDot.classList.add('active');
            } catch (e) {
                console.error("Camera failed", e);
                loader.innerHTML = "Camera denied. Using Mouse Mode.";
                setTimeout(() => loader.style.opacity = '0', 2000);
                document.getElementById('toggle-camera').checked = false;
                CONFIG.cameraEnabled = false;
            }
        }

        function onHandsResults(results) {
            if (!CONFIG.cameraEnabled) return;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                
                let totalSpread = 0;
                let handCount = 0;
                let wristA, wristB;

                results.multiHandLandmarks.forEach((landmarks, index) => {
                    handCount++;
                    // 0 = wrist, 4 = thumb_tip, 8 = index_tip, 20 = pinky_tip
                    
                    // 1. Detect Open vs Closed (Tension)
                    // Calculate avg distance of fingertips to wrist
                    const wrist = landmarks[0];
                    if(index===0) wristA = wrist;
                    if(index===1) wristB = wrist;

                    const tips = [4, 8, 12, 16, 20];
                    let avgDist = 0;
                    tips.forEach(idx => {
                        const tip = landmarks[idx];
                        const d = Math.sqrt(Math.pow(tip.x - wrist.x, 2) + Math.pow(tip.y - wrist.y, 2));
                        avgDist += d;
                    });
                    avgDist /= 5;

                    // Heuristic: Small avgDist = Fist, Large = Open
                    // Normalize roughly: 0.1 (closed) to 0.4 (open)
                    const spread = THREE.MathUtils.mapLinear(avgDist, 0.1, 0.35, 0, 1);
                    totalSpread += THREE.MathUtils.clamp(spread, 0, 1);
                });

                // Average spread across hands detected
                const finalSpread = totalSpread / handCount;
                
                // Smooth transition (Lerp)
                STATE.gestureSpread = THREE.MathUtils.lerp(STATE.gestureSpread, finalSpread, 0.1);

                // 2. Detect Distance between hands (Scale)
                if (handCount === 2) {
                    const dist = Math.sqrt(
                        Math.pow(wristA.x - wristB.x, 2) + 
                        Math.pow(wristA.y - wristB.y, 2)
                    );
                    // Map distance (approx 0.1 to 0.8 screen space) to scale (0.5 to 2.0)
                    const targetScale = THREE.MathUtils.mapLinear(dist, 0.2, 0.7, 0.5, 2.5);
                    STATE.gestureScale = THREE.MathUtils.lerp(STATE.gestureScale, targetScale, 0.1);
                }

            } else {
                // No hands, drift back to neutral
                STATE.gestureSpread = THREE.MathUtils.lerp(STATE.gestureSpread, 0.2, 0.05);
            }
        }


        // --- UI Event Listeners ---

        document.getElementById('toggle-camera').addEventListener('change', (e) => {
            CONFIG.cameraEnabled = e.target.checked;
            statusDot.style.background = CONFIG.cameraEnabled ? '#00ff88' : '#ff4444';
            statusDot.style.boxShadow = CONFIG.cameraEnabled ? '0 0 8px #00ff88' : '0 0 8px #ff4444';
        });

        // Shape buttons
        document.querySelectorAll('.shape-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const shape = e.currentTarget.dataset.shape;
                
                document.querySelectorAll('.shape-btn').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                
                switchShape(shape);
            });
        });

        // Color
        document.getElementById('color-input').addEventListener('input', (e) => {
            CONFIG.baseColor.set(e.target.value);
            particleMaterial.uniforms.uColor.value.copy(CONFIG.baseColor);
            scene.fog.color.copy(CONFIG.baseColor);
        });

        // Sliders
        const sizeSlider = document.getElementById('size-slider');
        const noiseSlider = document.getElementById('noise-slider');
        
        // Mouse Fallback
        document.addEventListener('mousemove', (e) => {
            if(!CONFIG.cameraEnabled) {
                // Map mouse X to rotation/scale, Y to spread
                const nx = (e.clientX / window.innerWidth) * 2 - 1;
                const ny = (e.clientY / window.innerHeight) * 2 - 1;
                
                // When manual, influence spread with mouse height (bottom = closed, top = open)
                const targetSpread = THREE.MathUtils.mapLinear(ny, 1, -1, 0, 1);
                STATE.gestureSpread = THREE.MathUtils.lerp(STATE.gestureSpread, targetSpread, 0.1);
            }
        });

        document.getElementById('snap-btn').addEventListener('click', () => {
            renderer.render(scene, camera);
            const dataURL = renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `particle-snap-${Date.now()}.png`;
            link.href = dataURL;
            link.click();
        });


        // --- Animation Loop ---

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const dt = clock.getDelta();
            const time = clock.getElapsedTime();

            controls.update();

            // 1. Handle Shape Morphing
            if(isMorphing) {
                morphTime += dt;
                const duration = 1.5; // seconds to morph
                let factor = morphTime / duration;
                
                // Ease out cubic
                factor = 1 - Math.pow(1 - factor, 3);
                
                if(factor >= 1) {
                    factor = 1;
                    isMorphing = false;
                }
                
                particleMaterial.uniforms.uMorphFactor.value = factor;
            }

            // 2. Update Uniforms from State
            particleMaterial.uniforms.uTime.value = time;
            
            // Base values from sliders + Gesture influence
            const baseSize = parseFloat(sizeSlider.value);
            const baseNoise = parseFloat(noiseSlider.value);
            
            // Logic: High spread (Open hand) -> More noise/expansion
            // Low spread (Fist) -> Tighter, less noise
            particleMaterial.uniforms.uSpread.value = baseNoise + (STATE.gestureSpread * 2.0); 
            particleMaterial.uniforms.uSize.value = baseSize;
            particleMaterial.uniforms.uScale.value = STATE.gestureScale;

            // 3. Auto-rotation
            scene.rotation.y = time * 0.05;

            renderer.render(scene, camera);
        }

        // --- Init ---
        
        // Load scripts from import map effectively, but for MediaPipe global scripts we rely on the CDN tags injected dynamically or present in head if we added them. 
        // Since we are using type="module", we can just start.
        
        // We need to inject the global script tags for MediaPipe properly because they are not ES modules by default in the simplified examples
        const script1 = document.createElement('script');
        script1.src = "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js";
        script1.crossOrigin = "anonymous";
        document.head.appendChild(script1);

        const script2 = document.createElement('script');
        script2.src = "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js";
        script2.crossOrigin = "anonymous";
        script2.onload = () => {
            initCamera(); // Start camera once loaded
        };
        document.head.appendChild(script2);

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
